services:
  graphhopper:
    build: .
    image: graphhopper-landmark:latest
    container_name: graphhopper-landmark
    ports:
      - "8989:8989"   # /route API + /maps UI
      - "8990:8990"   # Dropwizard admin (/healthcheck, metrics)
    volumes:
      # Persisted imported graph — survives container rebuilds, no re-import.
      - ./graph-cache:/data/graph-cache
      # OSM input (read-only); only used on first import when graph-cache is empty.
      - ./Nepal_data.v07172026.osm.pbf:/data/Nepal_data.v07172026.osm.pbf:ro
    environment:
      JAVA_OPTS: "-Xmx4g -Xms512m"
      # Optional overrides (defaults are baked into the Dockerfile ENV):
      # DATAREADER_FILE: /data/Nepal_data.v07172026.osm.pbf
      # GRAPH_LOCATION: /data/graph-cache
    # The runtime image has no curl/wget, but it does have bash — /dev/tcp is
    # enough to tell whether the connector is accepting connections.
    # start_period is generous: a cold start loads the 173M graph into RAM_STORE,
    # and a first-ever run imports the PBF.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8989"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    restart: unless-stopped

  wrapper:
    build: ./incident-wrapper
    image: graphhopper-incident-wrapper:latest
    container_name: graphhopper-incident-wrapper
    ports:
      - "8000:8000"   # dashboard at /, API at /incidents + /route, docs at /docs
    volumes:
      # Incident DB lives on the host so closures survive rebuilds.
      # A directory (not a single file) — a single-file bind mount would be
      # created as a *directory* by Docker on a fresh clone, and SQLite needs to
      # write its journal alongside the db.
      - ./incident-wrapper/data:/data
    environment:
      # Reach GraphHopper by service name over the compose network, not localhost.
      GRAPHOPPER_URL: "http://graphhopper:8989"
      INCIDENTS_DB: "/data/incidents.db"
    # BAATO_KEY comes from the gitignored .env; the file is optional so the stack
    # still starts without a key (the dashboard falls back to Esri imagery).
    env_file:
      - path: ./incident-wrapper/.env
        required: false
    depends_on:
      graphhopper:
        condition: service_started
    restart: unless-stopped
